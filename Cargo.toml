[package]
name = "aion2-auras"
version = "0.1.0"
edition = "2021"
description = "Cooldown and buff overlay for AION 2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
libloading = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
