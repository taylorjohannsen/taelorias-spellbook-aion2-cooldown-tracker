[package]
name = "tjcd"
version = "0.2.0"
edition = "2021"
description = "Cooldown and buff overlay for AION 2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
libloading = "0.8"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-updater = "2"

[profile.release]
strip = true
